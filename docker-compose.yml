services:
  postgres:
    image: postgres:16-alpine
    container_name: at-field-postgres
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-at_field}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
